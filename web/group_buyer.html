<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyer Mailbox</title>
<style>
:root {
  --bg: #f3f1f5; --panel: #fff; --sunk: #f7f5f9; --fg: #1d1b20; --muted: #736d7a; --line: #e4e0e8;
  --accent: #6e4a86; --accent-soft: #f1e9f6; --hotel: #1f4e5f; --hotel-soft: #e3eef1; --ok: #1e7a46; --ok-soft: #e2f3e8;
  --warn: #8a5a00; --warn-soft: #fcefd3; --bad: #a3271d; --bad-soft: #f8e2df; --on-accent: #fff;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141216; --panel: #1d1b20; --sunk: #242128; --fg: #efecf2; --muted: #a59eab; --line: #35313a;
  --accent: #c9a2dc; --accent-soft: #2c2133; --hotel: #82b9cc; --hotel-soft: #1d3037; --ok: #62cf91; --ok-soft: #16301f;
  --warn: #e6b455; --warn-soft: #372b13; --bad: #ef8a80; --bad-soft: #3a1d1a; --on-accent: #1a1220; } }
:root[data-theme="dark"] {
  --bg: #141216; --panel: #1d1b20; --sunk: #242128; --fg: #efecf2; --muted: #a59eab; --line: #35313a;
  --accent: #c9a2dc; --accent-soft: #2c2133; --hotel: #82b9cc; --hotel-soft: #1d3037; --ok: #62cf91; --ok-soft: #16301f;
  --warn: #e6b455; --warn-soft: #372b13; --bad: #ef8a80; --bad-soft: #3a1d1a; --on-accent: #1a1220; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); } button:disabled { opacity: .45; cursor: default; }
.btn-p { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn-ok { background: var(--ok); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-bad { color: var(--bad); }
input[type=text], input[type=number], textarea, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); max-width: 100%; }
textarea { width: 100%; resize: vertical; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
header h1 { margin: 0; font-size: 16px; } header h1 span { color: var(--muted); font-weight: 500; }
.pill { padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; white-space: nowrap; }
.spacer { flex: 1; }
main { max-width: 780px; margin: 0 auto; padding: 18px 18px 60px; }
@media (max-width: 760px) { main { padding: 12px 12px 60px; } header { padding: 10px 12px; } }
.subject { font-size: 19px; font-weight: 650; margin: 2px 0 2px; overflow-wrap: anywhere; }
.lede { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
.mail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.mail .hd { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; cursor: pointer; }
.mail .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; align-self: center; }
.mail.hotel .av { background: var(--hotel-soft); color: var(--hotel); } .mail.me .av { background: var(--accent-soft); color: var(--accent); }
.mail .who { font-weight: 600; } .mail .addr { color: var(--muted); font-size: 12.5px; }
.mail .at { margin-left: auto; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.mail .hd .t { min-width: 0; flex: 1; } .mail .peek { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail .bd { padding: 0 14px 14px 54px; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 760px) { .mail .bd { padding-left: 14px; } }
.mail .qs { margin: 10px 0 0; padding-left: 22px; white-space: normal; } .mail .qs li { margin: 4px 0; }
.mail:not(.open) .bd { display: none; } .mail.open .peek { display: none; }
.att { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--sunk); white-space: normal; }
.att .h { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.att table { width: 100%; border-collapse: collapse; } .att td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.att td.r { text-align: right; white-space: nowrap; padding-left: 10px; font-variant-numeric: tabular-nums; }
.att tr.tot td { border-bottom: 0; font-weight: 700; padding-top: 6px; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } .facts span { background: var(--panel); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--panel); color: var(--muted); }
.box { border-radius: 12px; padding: 14px 16px; margin: 14px 0; border: 1px solid var(--line); background: var(--panel); }
.box.warn { border-color: var(--warn); background: var(--warn-soft); } .box.ok { border-color: var(--ok); background: var(--ok-soft); }
.box.wait { background: var(--sunk); }
.box h3 { margin: 0 0 4px; font-size: 15px; } .box p { margin: 4px 0 10px; }
.box .who { font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; margin-bottom: 4px; color: var(--muted); }
.box.warn .who { color: var(--warn); } .box.ok .who { color: var(--ok); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 8px; }
.form label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.pulse { animation: pulse 1.1s infinite; } @keyframes pulse { 50% { opacity: .35; } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; z-index: 50; max-width: 90vw; }
details.older > summary { color: var(--muted); font-size: 12.5px; cursor: pointer; margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Mailbox</h1>
  <span class="pill">Buyer's side · demo</span>
  <span class="spacer"></span>
  <span class="small muted" id="clock"></span>
</header>
<main>
  <div class="subject" id="subject"></div>
  <p class="lede" id="lede"></p>
  <div id="thread"></div>
  <div id="act"></div>
</main>
<script>
const CFG = __INBOX__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const gbp = p => p == null ? '–' : (p < 0 ? '−' : '') + '£' + (Math.abs(p) / 100).toLocaleString('en-GB', {minimumFractionDigits: Math.abs(p) % 100 ? 2 : 0, maximumFractionDigits: 2});
const when = iso => iso ? new Date(iso).toLocaleString('en-GB', {timeZone: 'Europe/London', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '–';
let V = null, form = null, lastJSON = '', opened = new Set(), draftDirty = false;

function toast(t) { document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || r.statusText); throw new Error(j.error || r.statusText); }
  return j;
}
const busyTyping = () => { const a = document.activeElement; return a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName); };
async function load() {
  let v; try { v = await api(`/api/buyer/${CFG.id}/view?t=${encodeURIComponent(CFG.t)}`); } catch (e) { return; }
  V = v;
  $('clock').textContent = 'Scenario time ' + new Date(v.clock).toLocaleString('en-GB', {timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  const j = JSON.stringify(v);
  if (j === lastJSON || form || draftDirty || busyTyping()) return;
  lastJSON = j;
  render();
}
const cur = () => V.versions.length ? V.versions[V.versions.length - 1] : null;
const ver = n => V.versions.find(x => x.n === n);
function attachment(v) {
  const p = v.pricing, t = v.terms;
  return `<div class="att"><div class="h"><span>${v.kind === 'amendment' ? 'Change' : 'Offer'} v${v.n}</span><span class="chip">${esc(v.status.replaceAll('_', ' '))}</span></div>
    <table>${p.lines.map(l => `<tr><td>${esc(l.item.replace(/ \(.*\)/, ''))}<div class="small muted">${l.unit == null ? `Bundled service · ${l.qty} units` : `${l.qty} × ${gbp(l.unit)}`}${l.note ? ' · ' + esc(l.note) : ''}</div></td><td class="r">${gbp(l.amount)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="r">${gbp(p.total)}</td></tr></table>
    <div class="facts"><span>Deposit <b>${t.deposit_pct}% · ${gbp(p.deposit)}</b></span><span>Free release <b>${t.attrition_pct}%</b></span>${v.expires_at && v.status === 'sent' ? `<span>Valid until <b>${when(v.expires_at)}</b></span>` : ''}</div></div>`;
}
// The seller's questions and date options travel as lists beside the email text; show them in the email.
function asked(m) {
  const qs = (m.questions || []).filter(q => q && String(q).trim()), ds = m.date_options || [];
  const said = (m.text || '').toLowerCase();
  let h = '';
  if (qs.length && !qs.every(q => said.includes(String(q).trim().toLowerCase()))) h += `<ol class="qs">${qs.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`;
  if (ds.length) h += `<ol class="qs">${ds.map(o => `<li>${esc(span(o.arrival, o.departure))}</li>`).join('')}</ol>`;
  return h;
}
function render() {
  const me = V.contact, hotelAddr = 'groups@harbourhouse.example';
  $('title').innerHTML = `${esc(me)} <span>· ${esc(V.company)}</span>`;
  document.title = `${V.company} Mailbox`;
  $('subject').textContent = V.subject || 'Group booking';
  $('lede').textContent = `Your email thread with ${V.hotel}. Replies you send here go to the hotel's seller agent.`;
  const msgs = V.thread;
  const mail = (m, i) => {
    const hotel = m.from === 'seller', v = m.version && ver(m.version);
    const open = i >= msgs.length - 2 || opened.has(m.id);
    const name = hotel ? V.hotel : me, addr = hotel ? hotelAddr : (V.sender || '').replace(/.*</, '').replace('>', '');
    return `<div class="mail ${hotel ? 'hotel' : 'me'}${open ? ' open' : ''}" data-id="${esc(m.id)}"><div class="hd"><span class="av">${esc(name[0] || '?')}</span>
      <div class="t"><span class="who">${esc(hotel ? name : name + ' (you)')}</span> <span class="addr">${esc(addr)}</span><div class="peek">${esc(m.text || '')}</div></div><span class="at">${when(m.at)}</span></div>
      <div class="bd">${esc(m.text || '(no text)')}${asked(m)}${v ? attachment(v) : ''}</div></div>`;
  };
  const older = msgs.slice(0, Math.max(0, msgs.length - 4)), recent = msgs.slice(older.length);
  $('thread').innerHTML = (older.length ? `<details class="older"><summary>${older.length} earlier message${older.length === 1 ? '' : 's'}</summary>${older.map((m, i) => mail(m, i)).join('')}</details>` : '')
    + recent.map((m, i) => mail(m, older.length + i)).join('');
  document.querySelectorAll('.mail .hd').forEach(h => h.onclick = () => { const el = h.parentElement; el.classList.toggle('open'); el.classList.contains('open') ? opened.add(el.dataset.id) : opened.delete(el.dataset.id); });
  $('act').innerHTML = actions();
  wire();
}
const span = (a, b) => { const x = new Date(a + 'T12:00:00Z'), y = new Date(b + 'T12:00:00Z'), m = d => d.toLocaleDateString('en-GB', {month: 'long', timeZone: 'UTC'});
  return x.getUTCMonth() === y.getUTCMonth() ? `${x.getUTCDate()} to ${y.getUTCDate()} ${m(y)} ${y.getUTCFullYear()}` : `${x.getUTCDate()} ${m(x)} to ${y.getUTCDate()} ${m(y)} ${y.getUTCFullYear()}`; };
const SUG = {reply: 'Send answers', counter: 'Send counteroffer', accept: 'Accept', change_request: 'Send change request', message: 'Send'};
function actions() {
  let h = '';
  for (const a of V.organizer) {
    h += `<div class="box warn"><div class="who">Your organizer · sign-off needed</div><h3>Authorize accepting v${a.version}?</h3>
      <p>${esc((a.reasons || []).map(r => r[0].toUpperCase() + r.slice(1)).join('. '))}${a.reasons && a.reasons.length ? '.' : ''} This is outside what you can agree alone.</p>
      <div class="row"><button class="btn-ok" data-org="${a.id}" data-d="approve">Approve as organizer</button><button class="btn-bad" data-org="${a.id}" data-d="reject">Reject</button></div></div>`;
  }
  if (V.pay_url) {
    const v = V.accepted_version && ver(V.accepted_version);
    h += `<div class="box warn"><div class="who">Payment</div><h3>Pay the ${gbp(v && v.pricing.deposit)} deposit</h3><p>On Airwallex's hosted page. Sandbox test card <b>4035 5010 0000 0008</b>, any future expiry, any CVC.</p>
      <div class="row"><a href="${esc(V.pay_url)}" target="_blank"><button class="btn-p">Open payment page ↗</button></a></div></div>`;
  }
  if (V.booking && V.booking.status === 'confirmed') {
    const f = V.finance_view, rooms = V.booking.rooms ? Math.max(...Object.values(V.booking.rooms)) : null;
    h += `<div class="box ok"><div class="who">Booked</div><h3>${rooms ? `${rooms} ${esc(V.booking.room_type)} rooms a night` : 'Confirmed'} · ${gbp(f.net_received)} paid</h3>
      ${f.refund_owed ? `<p>${gbp(f.refund_owed)} is owed back to you.</p>` : ''}${f.still_due ? `<p class="small muted">${gbp(f.still_due)} still due on the payment schedule.</p>` : ''}</div>`;
  }
  if (V.hotel_busy) h += `<p class="small muted"><span class="dot pulse"></span>${esc(V.hotel)} is replying…</p>`;
  if (V.buyer_mode === 'agent') return h + `<div class="box wait"><h3>The buyer agent is answering for you</h3><p class="small">It replies from ${esc(V.company)}'s brief on its own. Choose Buyer replies: "By you, in the buyer's mailbox" in the hotel's New inquiry drawer to reply here.</p></div>`;
  const v = cur(), s = V.suggestion, open = v && v.status === 'sent', booked = V.booking && V.booking.status === 'confirmed';
  const canWrite = !['lost', 'declined', 'handoff'].includes(V.status);
  if (!canWrite) return h;
  h += `<div class="box"><div class="who">Reply</div>`;
  if (s) {
    h += `<p class="small muted">Draft from ${esc(V.company)}'s private brief. Edit it if you like.</p>
      <textarea id="draft" rows="4">${esc(s.text)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn-p" data-act="sendSug">${s.action === 'accept' && v ? 'Accept v' + v.n : SUG[s.action] || 'Send'}</button>`;
  } else {
    h += `<p class="small muted">${V.waiting_on === 'hotel' ? `Waiting for ${esc(V.hotel)}. You can still write to them.` : booked ? 'Nothing needed from you right now.' : 'Nothing drafted from your brief right now.'}</p><div class="row">`;
  }
  if (open && !V.organizer.length && !(s && s.action === 'accept')) h += `<button class="${s ? '' : 'btn-p'}" data-act="accept">Accept v${v.n}</button>`;
  if (open && v.kind === 'offer') h += `<button data-form="counter">Counter…</button>`;
  if (V.status === 'needs_info' && !s) h += `<button data-form="answers">Answer…</button>`;
  const opts = V.status === 'dates_proposed' ? ((V.thread.slice().reverse().find(m => m.date_options) || {}).date_options || []) : [];
  opts.forEach((o, i) => { h += `<button class="${i ? '' : 'btn-p'}" data-act="dates" data-i="${i}">Take ${esc(span(o.arrival, o.departure))}</button>`; });
  if (booked && !(s && s.action === 'change_request')) h += `<button data-form="change">Request a change…</button>`;
  h += `<button class="btn-ghost" data-form="msg">Message…</button></div>${formHtml(v)}</div>`;
  return h;
}
function formHtml(v) {
  const t = v && v.terms;
  const go = label => `<div class="row" style="margin-top:6px"><button class="btn-p" data-act="sendForm">${label}</button><button class="btn-ghost" data-form="">Cancel</button></div>`;
  if (form === 'counter') return `<div class="form"><label>Attrition %<input type="number" id="fAtt" value="20" min="0" max="30"></label>
      <label>Deposit %<input type="number" id="fDep" value="25" min="0" max="60"></label><label>Room rate £ (optional)<input type="number" id="fRate" placeholder="${t ? t.rate / 100 : ''}"></label></div>
      <textarea id="fText" rows="2" placeholder="Message to the hotel (optional)"></textarea>${go('Send counteroffer')}`;
  if (form === 'change') return `<div class="form"><label>Fewer rooms per night<input type="number" id="fRooms" value="2" min="1"></label></div>
      <textarea id="fText" rows="2" placeholder="Message to the hotel (optional)"></textarea>${go('Send change request')}`;
  if (form === 'answers') return `<div class="form"><label>Meeting layout<input type="text" id="fLayout" value="classroom"></label><label>Legal payer<input type="text" id="fPayer"></label>
      <label>Budget includes taxes?<select id="fTax"><option value="true">Yes</option><option value="false">No</option></select></label></div>${go('Send answers')}`;
  if (form === 'msg') return `<textarea id="fText" rows="3" placeholder="Message to the hotel" style="margin-top:10px"></textarea>${go('Send')}`;
  return '';
}
function refresh() { lastJSON = ''; draftDirty = false; load(); }
function wire() {
  if ($('draft')) $('draft').oninput = () => { draftDirty = true; };
  document.querySelectorAll('[data-form]').forEach(b => b.onclick = () => { form = b.dataset.form || null; $('act').innerHTML = actions(); wire(); if (!form) refresh(); });
  document.querySelectorAll('[data-org]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/buyer/${CFG.id}/organizer`, {token: CFG.t, approval_id: b.dataset.org, decision: b.dataset.d}); toast(b.dataset.d === 'approve' ? 'Authorized' : 'Rejected'); }
    catch (e) {} finally { refresh(); }
  });
  const act = (action, text, payload) => api(`/api/buyer/${CFG.id}`, {token: CFG.t, action, text, payload});
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const v = cur(), s = V.suggestion, a = b.dataset.act;
    let note = 'Sent to ' + V.hotel;
    try {
      if (a === 'sendSug') await act(s.action, ($('draft') && $('draft').value.trim()) || s.text, s.payload);
      else if (a === 'dates') {
        const o = (V.thread.slice().reverse().find(m => m.date_options) || {}).date_options[+b.dataset.i];
        await act('reply', `${span(o.arrival, o.departure)} works for us. Please send the offer for those dates.`, {dates: {arrival: o.arrival, departure: o.departure}});
      }
      else if (a === 'accept') {
        const r = await act('accept', `We accept version ${v.n}.`, {version: v.n});
        if (r.accepted === false) note = 'Over your own limits: your organizer needs to sign off';
      } else if (a === 'sendForm') {
        const text = $('fText') ? $('fText').value.trim() : '';
        if (form === 'counter') {
          const p = {attrition_pct: +$('fAtt').value, deposit_pct: +$('fDep').value}; if ($('fRate').value) p.rate = Math.round(+$('fRate').value * 100);
          await act('counter', text || `We'd like ${p.attrition_pct}% attrition and a ${p.deposit_pct}% deposit${p.rate ? ` at £${p.rate / 100}` : ''}.`, p);
        } else if (form === 'change') {
          const n = +$('fRooms').value; await act('change_request', text || `Please reduce our block by ${n} rooms per night.`, {rooms_per_night: n});
        } else if (form === 'answers') {
          const ans = {meeting_layout: $('fLayout').value, payer: $('fPayer').value, budget_includes_taxes: $('fTax').value === 'true'};
          await act('reply', `Layout: ${ans.meeting_layout}. Payer: ${ans.payer}. Our budget ${ans.budget_includes_taxes ? 'includes' : 'excludes'} taxes.`, {answers: ans});
        } else if (form === 'msg') { if (!text) { toast('Write a message first'); b.disabled = false; return; } await act('message', text, {}); }
        form = null;
      }
      toast(note);
    } catch (e) {} finally { b.disabled = false; refresh(); }
  });
}
load(); setInterval(load, 1500);
</script>
</body>
</html>
