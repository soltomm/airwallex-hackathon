# Runs the test suite on every pull request and every push to main.
# The "tests" job is a required status check in the "Protect main" ruleset, and both Render
# services (staging and the live demo) deploy only after it passes.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:                       # lets the Postgres storage tests run instead of skipping
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      PAYMENTS: simulated             # no keys in CI: simulated payments, rules seller
      SELLER_MODE: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[agent,postgres]" pytest
      - name: Test
        run: PYTHONPATH=src python -m pytest tests -q
