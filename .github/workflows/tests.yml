name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[agent]' pytest
      - name: Run offline tests
        env:
          PYTHONPATH: src
          PAYMENTS: simulated
          SELLER_MODE: rules
        run: python -m pytest tests -q
