[project]
name = "agentbank"
version = "0.1.0"
description = "Groupy: a hotel group-sales agent for the Airwallex Agentic Banking Hackathon"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agent = ["anthropic>=1.15"]
postgres = ["psycopg[binary]>=3.2"]   # only when DATABASE_URL is set (agentbank/storage.py)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
