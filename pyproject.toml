[project]
name = "agentbank"
version = "0.1.0"
description = "Starter kit for the Airwallex Agentic Banking Hackathon"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agent = ["anthropic>=1.15", "mcp>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
