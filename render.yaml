# Render blueprint for the Harbour House group-sales demo (branch group-sales).
# Dashboard > New > Blueprint > this repo, branch group-sales. Render asks for the sync:false secrets.
# Open the dashboard at  https://<service>.onrender.com/?k=<GS_ACCESS_TOKEN>  (service > Environment).
# The hotel-negotiation service is deployed from its own branch and its own blueprint.
services:
  - type: web
    name: harbour-house-group-sales
    runtime: python
    region: oregon        # same region as hotel-negotiation: the Airwallex key's IP whitelist has these egress IPs
    plan: free            # sleeps after 15 min idle (first request then takes ~1 min); state is in Postgres
    branch: group-sales
    buildCommand: pip install -e ".[agent,postgres]"
    startCommand: python scripts/group_sales.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: GS_ACCESS_TOKEN            # needed once to open the dashboard: <service URL>/?k=<token>
        generateValue: true
      - key: STORAGE_NAMESPACE          # keeps this demo's rows apart from hotel-negotiation's in the same database
        value: groupsales
      - key: PAYMENTS
        value: airwallex
      - key: BUYER_MODE                 # presenter plays the buyer; "agent" lets the buyer side answer itself
        value: presenter
      - key: GS_MAX_CLAUDE_RUNS_PER_DAY # then the rules seller takes over until the next day
        value: "150"
      - key: DATABASE_URL               # Postgres (Supabase transaction pooler URL); unset = files that reset on spin-down
        sync: false
      - key: ANTHROPIC_API_KEY          # Claude seller; without it the rules seller runs
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID     # only for user-level keys not tied to a workspace
        sync: false
      - key: AWX_CLIENT_ID              # Airwallex sandbox
        sync: false
      - key: AWX_API_KEY
        sync: false
      - key: AWX_WEBHOOK_SECRET         # optional: webhook URL <service URL>/webhooks/airwallex
        sync: false
